project_id = "athlete-lab"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.coach]
# The handler independently verifies every bearer token using Supabase getUser.
# Disables only the gateway's legacy JWT check, not application authentication.
verify_jwt = false
