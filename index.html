<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#214d3c"/>
    <meta name="description" content="Your training, with purpose. Plan sessions, follow prescriptions and record your progress."/>
    <link rel="icon" href="/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <title>Athlete Lab</title>
    <style>
      .startup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;gap:20px;padding:28px;background:#f6f7f2;color:#26372d;text-align:center;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}
      .startup h1{font-size:26px;margin:0}.startup p{max-width:440px;margin:0}.startup button{padding:12px 22px;border:0;border-radius:8px;background:#285741;color:white;font:inherit;cursor:pointer}.startup details{max-width:100%;text-align:left;font-size:13px}.startup pre{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}.startup [hidden]{display:none}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup" id="startup" aria-live="polite">
        <h1 id="startup-title">Opening your training space…</h1>
        <p id="startup-message">Connecting to the app on this device. If this message remains, check that JavaScript is enabled and reload.</p>
        <div id="startup-recovery" hidden>
          <button id="startup-reload" type="button">Reload app</button>
          <details><summary>Connection details</summary><pre id="startup-details"></pre></details>
        </div>
        <noscript><p>JavaScript is disabled. Enable JavaScript in Safari’s settings, then reload this page.</p></noscript>
      </main>
    </div>
    <script>
      (function () {
        var errors = [];
        function showFailure(message) {
          if (!document.getElementById('startup')) return;
          if (message) errors.push(message);
          document.getElementById('startup-title').textContent = 'The app could not finish opening';
          document.getElementById('startup-message').textContent = 'Reload to try again. If this keeps happening, share the connection details below so we can diagnose it. Your saved training has not been cleared.';
          document.getElementById('startup-recovery').hidden = false;
          document.getElementById('startup-details').textContent = location.origin + '\n' + navigator.userAgent + '\n' + (errors.join('\n') || 'Startup scripts did not finish loading.');
        }
        window.addEventListener('error', function (event) {
          if (event.message) showFailure(event.message);
          else if (event.target && event.target.tagName === 'SCRIPT') showFailure('An app script could not be downloaded.');
        }, true);
        window.addEventListener('unhandledrejection', function (event) { showFailure(String(event.reason && event.reason.message || event.reason || 'An app module could not load.')); });
        document.getElementById('startup-reload').addEventListener('click', function () { location.reload(); });
        setTimeout(function () { showFailure(); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
